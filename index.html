<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div class="app-container">
        <div id="start-screen" class="screen">
            <!-- Завдання 1 - Наповнення HTML -->
            <h1>Macbeth Quiz</h1>
            <p><button id="start-btn">Begin</button></p>
        </div>

        <div id="quiz-screen" class="screen hide ">
            <!-- Блок з таймером та балами -->
            <div class="header">
                <p><span id="timer">Time: 15</span></p>
            </div>
            <h2 id="question-text">Qustion 1</h2>
            <div id="answers-container">
            </div>
        </div>

        <div id="result-screen" class="screen hide">
            <!-- Блок з результатом -->
            <h1>Quiz has ended!!!</h1>
            <p class="result-text"></p>
            <p><button id="restart-btn">Try again</button></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
